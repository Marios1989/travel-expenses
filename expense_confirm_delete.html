<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Διαγραφή Εξόδου</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm p-4">
            <h3>⚠️ Διαγραφή Εξόδου</h3>
            <p>Είστε σίγουροι ότι θέλετε να διαγράψετε το έξοδο ποσού <strong>{{ expense.amount_in_currency }} {{ expense.currency }}</strong>;</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Ναι, Διαγραφή</button>
                <a href="{% url 'trips:trip_detail' expense.trip.pk %}" class="btn btn-secondary">Ακύρωση</a>
            </form>
        </div>
    </div>
</body>
</html>
