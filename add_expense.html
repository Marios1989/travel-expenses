<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Καταχώριση Δαπάνης</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">➕ Νέα Δαπάνη για: {{ trip.title }}</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Αποθήκευση Δαπάνης</button>
                </form>
                <a href="{% url 'trips:trip_detail' trip.pk %}" class="btn btn-link w-100 mt-2">Επιστροφή</a>
            </div>
        </div>
    </div>
</body>
</html>
