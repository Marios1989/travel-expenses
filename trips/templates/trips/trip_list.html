<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Λίστα Ταξιδιών</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">✈️ Διαχείριση Ταξιδιών & Εξόδων</h2>
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Κωδικός</th>
                            <th>Τίτλος</th>
                            <th>Ταξιδιώτης</th>
                            <th>Κατάσταση</th>
                            <th>Ενέργειες</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for trip in trips %}
                        <tr>
                            <td>{{ trip.code }}</td>
                            <td>{{ trip.title }}</td>
                            <td>{{ trip.traveler.username }}</td>
                            <td><span class="badge bg-secondary">{{ trip.get_status_display }}</span></td>
                            <td>
                                <a href="{% url 'trips:trip_detail' trip.pk %}" class="btn btn-sm btn-primary">Προβολή</a>
                                <a href="{% url 'trips:add_trip' %}" class="btn btn-primary mb-3">+ Νέο Ταξίδι</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center text-muted">Δεν βρέθηκαν καταχωρημένα ταξίδια.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
