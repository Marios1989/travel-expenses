<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Νέο Ταξίδι</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="mb-4">➕ Προσθήκη Νέου Ταξιδιού</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Αποθήκευση Ταξιδιού</button>
                <a href="{% url 'trips:trip_list' %}" class="btn btn-secondary">Επιστροφή στη Λίστα</a>
            </form>
        </div>
    </div>
</body>
</html>
